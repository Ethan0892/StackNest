# nginx reverse proxy for StackNest
# Installed by deploy_hetzner.sh to /etc/nginx/sites-available/stacknest
#
# Replace stacknests.com with your actual domain (deploy_hetzner.sh does this automatically)
# Manual:  sed 's/stacknests.com/stacknest.dev/g' deploy/nginx.stacknest.conf > /etc/nginx/sites-available/stacknest

# ── HTTP server (certbot --nginx will add HTTPS redirect + SSL block) ────────
server {
    server_name stacknests.com www.stacknests.com;

    # ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ { root /var/www/html; }

    # Security headers
    add_header X-Content-Type-Options  nosniff                              always;
    add_header X-Frame-Options         DENY                                 always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin"    always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()"    always;
    # CSP applied per-location so Flask-proxied routes (/api, /admin) only get
    # Flask's own header and never a conflicting duplicate from nginx.

    # Max upload size (for JAR payloads and bot source zip uploads)
    client_max_body_size 25m;

    # Gzip static assets
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── Static frontend files ─────────────────────────────────────────────
    root /opt/stacknest/frontend;
    index index.html;

    # ── Custom error pages ────────────────────────────────────────────────
    error_page 404             /404.html;
    error_page 403             /403.html;
    error_page 429             /429.html;
    error_page 500 502 503 504 /500.html;

    location = /404.html { internal; }
    location = /403.html { internal; }
    location = /429.html { internal; }
    location = /500.html { internal; }

    # Serve .html, .svg, .css, .js directly via nginx (no Flask hit)
    location ~* \.(html|svg|ico|css|js|woff2?|ttf|eot)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        add_header X-Content-Type-Options  nosniff                                       always;
        add_header X-Frame-Options         SAMEORIGIN                                    always;
        add_header Referrer-Policy         "strict-origin-when-cross-origin"             always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Permissions-Policy      "geolocation=(), microphone=(), camera=()"    always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com https://cdn.jsdelivr.net https://esm.sh; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https://accounts.google.com https://esm.sh; frame-src https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self';" always;
        try_files $uri =404;
    }

    # -- /api/auth/me: lenient rate limit (called on every page load)
    location = /api/auth/me {
        limit_req zone=api_general burst=20 nodelay;
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 430s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 430s;
    }

    # -- Auth endpoints: strict rate limit (login/register/password reset)
    location ~ ^/api/(auth|login|register) {
        limit_req zone=api_auth burst=5 nodelay;
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 430s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 430s;
    }

    # -- Generate endpoint: rate limit (expensive)
    location /api/generate {
        limit_req zone=api_generate burst=3 nodelay;
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 730s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 730s;
        proxy_buffering off;
        proxy_cache off;
    }

    # ── API proxy → Gunicorn on localhost:5000 ────────────────────────────
    location /api/ {
        limit_req zone=api_general burst=20 nodelay;
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Match gunicorn timeout
        proxy_read_timeout    730s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    730s;

        # SSE streaming (for /api/stream)
        proxy_buffering off;
        proxy_cache off;
    }

    # ── Admin panel ───────────────────────────────────────────────────────
    location /admin {
        # Restrict admin to your IP (recommended — replace with your IP)
        # allow 1.2.3.4;
        # deny all;

        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Catch-all → serve frontend SPA ───────────────────────────────────
    # $uri.html lets clean URLs like /pricing resolve to pricing.html
    # =404 fallback triggers the custom 404.html error page for unknown routes
    location / {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com https://cdn.jsdelivr.net https://esm.sh; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https://accounts.google.com https://esm.sh; frame-src https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self';" always;
        try_files $uri $uri.html $uri/ =404;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/stacknests.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/stacknests.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

server {
    if ($host = www.stacknests.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = stacknests.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name stacknests.com www.stacknests.com;
    return 404; # managed by Certbot




}