<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Reset Password — StackNest</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0f;
      font-family: Inter, system-ui, sans-serif;
      color: #e2e4f0;
    }
    .card {
      background: #1a1d26;
      border: 1px solid #2e3350;
      border-radius: 14px;
      padding: 36px 40px;
      width: 100%;
      max-width: 420px;
    }
    .logo {
      font-size: 1.25rem;
      font-weight: 700;
      color: #e2e4f0;
      margin-bottom: 24px;
    }
    .logo span { color: #5c6fff; }
    h1 {
      font-size: 1.1rem;
      font-weight: 600;
      margin: 0 0 6px;
      color: #e2e4f0;
    }
    p.sub {
      font-size: 0.85rem;
      color: #7f85a3;
      margin: 0 0 24px;
      line-height: 1.5;
    }
    label {
      display: block;
      font-size: 0.8rem;
      color: #9094b0;
      margin-bottom: 6px;
    }
    input[type="password"] {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #2e3350;
      background: #111320;
      color: #e2e4f0;
      font-size: 0.95rem;
      outline: none;
      transition: border-color .15s;
    }
    input[type="password"]:focus { border-color: #5c6fff; }
    .pw-wrap { position: relative; margin-bottom: 20px; }
    .pw-toggle {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #7f85a3;
      font-size: 0.8rem;
      padding: 2px 6px;
    }
    .pw-toggle:hover { color: #c0c3e0; }
    .btn {
      width: 100%;
      padding: 11px;
      background: #5c6fff;
      color: #fff;
      font-weight: 600;
      font-size: 0.95rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background .15s, opacity .15s;
    }
    .btn:hover:not(:disabled) { background: #4a5be8; }
    .btn:disabled { opacity: .55; cursor: not-allowed; }
    .msg {
      margin-top: 16px;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      display: none;
    }
    .msg.error  { background: #2e1520; border: 1px solid #7f1d3a; color: #f09; }
    .msg.success{ background: #0f2a1e; border: 1px solid #1a6b3a; color: #4ade80; }
    .footer-link {
      text-align: center;
      margin-top: 18px;
      font-size: 0.82rem;
      color: #7f85a3;
    }
    .footer-link a { color: #5c6fff; text-decoration: none; }
    .footer-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">Stack<span>Nest</span></div>
  <h1>Set a new password</h1>
  <p class="sub">Choose a strong password for your account.</p>

  <label for="pw">New password</label>
  <div class="pw-wrap">
    <input type="password" id="pw" placeholder="At least 8 characters" autocomplete="new-password" />
    <button class="pw-toggle" type="button" onclick="togglePw('pw',this)">Show</button>
  </div>

  <label for="pw2">Confirm password</label>
  <div class="pw-wrap">
    <input type="password" id="pw2" placeholder="Repeat password" autocomplete="new-password" />
    <button class="pw-toggle" type="button" onclick="togglePw('pw2',this)">Show</button>
  </div>

  <button class="btn" id="btn" onclick="doReset()">Reset password</button>
  <div class="msg" id="msg"></div>
  <div class="footer-link"><a href="/app">Back to StackNest</a></div>
</div>

<script>
  function togglePw(id, btn) {
    const el = document.getElementById(id);
    const hidden = el.type === 'password';
    el.type = hidden ? 'text' : 'password';
    btn.textContent = hidden ? 'Hide' : 'Show';
  }

  function showMsg(text, type) {
    const el = document.getElementById('msg');
    el.textContent = text;
    el.className = 'msg ' + type;
    el.style.display = 'block';
  }

  function getToken() {
    const p = new URLSearchParams(location.search);
    return p.get('token') || '';
  }

  async function doReset() {
    const token = getToken();
    if (!token) {
      showMsg('Missing reset token. Please use the link from your email.', 'error');
      return;
    }
    const pw  = document.getElementById('pw').value;
    const pw2 = document.getElementById('pw2').value;
    if (pw.length < 8) { showMsg('Password must be at least 8 characters.', 'error'); return; }
    if (pw !== pw2)     { showMsg('Passwords do not match.', 'error'); return; }

    const btn = document.getElementById('btn');
    btn.disabled = true;
    btn.textContent = 'Resetting…';

    try {
      const res  = await fetch('/api/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, password: pw }),
      });
      const data = await res.json();
      if (!res.ok) {
        showMsg(data.error || 'Something went wrong. Please try again.', 'error');
        btn.disabled = false;
        btn.textContent = 'Reset password';
        return;
      }
      // Save session token and redirect to app
      if (data.token) localStorage.setItem('sn_token', data.token);
      if (data.user)  localStorage.setItem('sn_user',  JSON.stringify(data.user));
      showMsg('Password updated! Redirecting…', 'success');
      setTimeout(() => { location.href = '/app'; }, 1200);
    } catch (e) {
      showMsg('Network error. Please try again.', 'error');
      btn.disabled = false;
      btn.textContent = 'Reset password';
    }
  }

  // Show error immediately if no token in URL
  if (!getToken()) {
    document.querySelector('p.sub').textContent =
      'No reset token found. Please use the link from your email, or request a new one.';
    document.getElementById('btn').disabled = true;
  }

  // Allow Enter key to submit
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') doReset();
  });
</script>
</body>
</html>
