<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="#0f1117"/>

  <!-- Stack of three layers — widest at top, tapering down -->
  <!-- Layer 1 (top / widest) -->
  <rect x="10" y="13" width="44" height="9" rx="4.5" fill="#5c6fff"/>
  <!-- Layer 2 (middle) -->
  <rect x="16" y="27" width="32" height="9" rx="4.5" fill="#7b8fff"/>
  <!-- Layer 3 (bottom / narrowest) -->
  <rect x="22" y="41" width="20" height="9" rx="4.5" fill="#a5aeff"/>
</svg>
