// Forge 1.21.x — ForgeGradle 6.x
// IMPORTANT: Forge 51.x (1.21) removed FMLJavaModLoadingContext.
// Use constructor injection: public YourMod(IEventBus modEventBus) { ... }
plugins {
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
    id 'java'
}

version = '1.0.0'
group = 'com.example.examplemod'

minecraft {
    mappings channel: 'official', version: '1.21.1'

    runs {
        server {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods {
                examplemod { source sourceSets.main }
            }
        }
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods {
                examplemod { source sourceSets.main }
            }
        }
    }
}

repositories {}

dependencies {
    minecraft 'net.minecraftforge:forge:1.21.1-51.0.33'
}

jar {
    manifest {
        attributes([
            "Specification-Title"   : "examplemod",
            "Specification-Version" : "1",
            "Implementation-Title"  : project.name,
            "Implementation-Version": project.version,
        ])
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}
